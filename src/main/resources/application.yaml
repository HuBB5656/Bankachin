spring:
  application:
    name: Bankachin

  datasource:
    url: jdbc:postgresql://localhost:5432/bankachin
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 7001